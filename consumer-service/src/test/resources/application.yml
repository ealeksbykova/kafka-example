# Test profile for consumer-service.
#
# Unit and slice tests must run without PostgreSQL or Kafka:
#   * no listener container is started (there is no broker to talk to),
#   * the JPA repository is mocked in the web slice tests.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

logging:
  level:
    com.example.orders: WARN
    org.springframework: WARN
